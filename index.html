<title>EKP kolokvij: vadba</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2333; --muted:#5d6678; --line:#d9dfec;
  --navy:#1f3864; --blue:#2e5597; --soft:#dce6f4;
  --good:#2f7d32; --goodbg:#e5f3e3; --mid:#b07400; --midbg:#fff4d6; --bad:#b3261e; --badbg:#fde7e5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10141d; --card:#192030; --ink:#e8ecf5; --muted:#9aa5bc; --line:#2b3550;
    --navy:#8fb2ee; --blue:#7aa2e6; --soft:#22304d;
    --good:#7ccf80; --goodbg:#1c3320; --mid:#e8b44a; --midbg:#3a2f12; --bad:#f08b83; --badbg:#3b1b19; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px;color:var(--navy)}
h2{font-size:18px;margin:0 0 8px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.btn{appearance:none;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--blue)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.topic{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.topic:hover{border-color:var(--blue)}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--navy);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 8px;color:var(--muted);font-size:14px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.hint{color:var(--muted);font-size:13px}
.score{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.pct{font-size:44px;font-weight:800;line-height:1}
.pct.good{color:var(--good)} .pct.mid{color:var(--mid)} .pct.bad{color:var(--bad)}
.verdict{font-weight:700}
.crit{list-style:none;padding:0;margin:8px 0}
.crit li{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:8px 10px;margin:0 0 6px}
.crit li.ok{background:var(--goodbg)} .crit li.part{background:var(--midbg)} .crit li.no{background:var(--badbg)} .crit li.pen{background:var(--badbg);border:1px solid var(--bad)}
.crit .ic{font-weight:800;width:18px;text-align:center}
.crit .pts{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.model{border-left:4px solid var(--blue);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.model p{margin:0 0 6px} .model ul{margin:0 0 6px;padding-left:20px}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px;background:var(--soft);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
</style>
</head>

<script>
const QS = [{"n":1,"topic":"Opredelitev ekonomike in gospodarjenja","title":"Zakaj je ekonomika pomembna za posameznika","question":"Pojasnite, zakaj je poznavanje ekonomike pomembno tudi za posameznika. Kako se ekonomsko razmišljanje odraža v vsakdanjem življenju? Podajte konkreten primer in utemeljite svoje mnenje.","model":["Vsak od nas ima omejen denar in čas, želja pa je veliko več. Ekonomika nas uči, kako s tem premišljeno gospodariti: kaj kupiti, koliko prihraniti, ali se splača vzeti kredit, ali je bolje delati ali študirati. Zato ni samo za podjetnike, ampak za vsakogar.","V vsakdanjem življenju ekonomsko razmišljamo, ko primerjamo cene, načrtujemo mesečni proračun, izbiramo med dvema ponudbama ali odločamo, ali bomo nekaj prihranili.","**Primer:** študent ima na mesec 300 € in mora izbirati med najemnino, hrano, prevozom in zabavo. Če si denarja ne razporedi načrtno, ga zmanjka pred koncem meseca.","**Mnenje:** to znanje je pomembno, ker pomeni manj dolgov, manj stresa in več možnosti. Kdor razume, kako deluje denar, se lažje izogne slabim posojilom in bolje varčuje."]},{"n":2,"topic":"Opredelitev ekonomike in gospodarjenja","title":"Gospodarjenje in posledice nerazumne rabe","question":"Kaj razumemo pod pojmom gospodarjenje in zakaj je pomembno, da je gospodarjenje načrtno in premišljeno? Pojasnite, kakšne posledice lahko ima neracionalna uporaba razpoložljivih sredstev za posameznika in za podjetje.","model":["**Gospodarjenje** je umno, načrtno in premišljeno pridobivanje ter uporabljanje dobrin za zadovoljevanje potreb posameznikov in družbe.","Načrtno mora biti zato, ker so sredstva omejena. Brez načrta jih porabimo za napačne stvari in zmanjka za tiste, ki so pomembnejše.","• **Posameznik:** dolgovi, brez prihrankov, težave pri plačilu nujnih stvari.","• **Podjetje:** nepotrebni stroški, zaloge, ki jih ne proda, izguba, slabša konkurenčnost, v skrajnem primeru stečaj."]},{"n":3,"topic":"Opredelitev ekonomike in gospodarjenja","title":"Ekonomika, omejena sredstva in negospodarno poslovanje","question":"Pojasnite povezavo med ekonomiko, omejenimi sredstvi in zadovoljevanjem potreb. Ali menite, da lahko tudi podjetje z velikimi finančnimi sredstvi posluje negospodarno? Utemeljite odgovor s primerom.","model":["Ekonomika proučuje, kako z omejenimi sredstvi čim bolje zadovoljiti potrebe, ki so skoraj neomejene. Ker vsega ne moremo imeti, moramo izbirati in sredstva smotrno uporabljati.","**Da, tudi bogato podjetje lahko posluje negospodarno.** Gospodarnost ni isto kot velikost denarja, ampak razmerje med učinki in stroški (ekonomičnost = prihodki / odhodki).","**Primer:** podjetje s polno blagajno najame prevelike pisarne in kupi drage stroje, ki jih ne izkoristi. Denarja je veliko, učinek pa majhen, zato ekonomičnost pade pod 1 in podjetje izgublja."]},{"n":4,"topic":"Redkost dobrin in izbira","title":"Redkost dobrin kot temeljni problem","question":"Pojasnite, zakaj je redkost dobrin temeljni ekonomski problem. Kako se ta problem kaže v poslovanju podjetja in kako v posameznikovem okolju? Podajte primer iz obeh okolij.","model":["Redkost pomeni, da je dobrin in virov premalo glede na naše potrebe. Zato je temeljni problem: iz nje izhajata **izbira** in **oportunitetni strošek**. Če bi bilo vsega dovolj, izbirati ne bi bilo treba.","• **Podjetje:** omejen kapital, čas, delavci in zmogljivosti. Ne more hkrati kupiti stroja, zaposliti ljudi in razširiti prodaje, zato postavlja prioritete.","• **Posameznik:** omejen proračun in čas. Primer: telefon ali potovanje, ne oboje hkrati."]},{"n":5,"topic":"Redkost dobrin in izbira","title":"Odločitev podjetja: oprema, delavci ali prodajna mreža","question":"Podjetje ima omejena finančna sredstva in se mora odločiti med nakupom nove proizvodne opreme, zaposlitvijo dodatnih delavcev ali širitvijo prodajne mreže. Pojasnite, kako bi pristopili k takšni odločitvi in katero možnost bi sami izbrali in zakaj.","model":["**Kako bi pristopil:**","• najprej bi določil cilj (rast prodaje, nižji stroški, odprava ozkega grla),","• za vsako možnost bi ocenil stroške, pričakovani donos, rok vračila in tveganje,","• upošteval bi oportunitetni strošek: kar izberem, se odpovem drugima dvema.","**Moja izbira:** odvisna je od tega, kje je težava. Če podjetje ne zmore naročil zaradi starih strojev, izberem opremo. Če kupcev ni dovolj, širim prodajno mrežo. Če ni posebnih podatkov, bi izbral **širitev prodajne mreže**, ker nov stroj brez kupcev samo poveča fiksne stroške in ne prinese prihodkov. Najprej je treba zagotoviti prodajo, šele nato povečevati proizvodnjo."]},{"n":6,"topic":"Redkost dobrin in izbira","title":"Ali je razvoj odpravil redkost","question":"Ali menite, da je gospodarski razvoj odpravil problem redkosti dobrin ali pa je ustvaril nove oblike ekonomskih problemov? Pojasnite svoj odgovor in razmislite tudi o povezavi med večjo materialno proizvodnjo, porabo naravnih virov in ekologijo.","model":["**Ne, razvoj redkosti ni odpravil, ampak jo je premaknil.** Večja proizvodnja je zadovoljila več potreb, vendar so z višjim standardom zrasle tudi potrebe.","Nastali so novi problemi: večja proizvodnja porabi več naravnih virov in energije, povzroča onesnaževanje, odpadke in podnebne spremembe. Tudi čisto okolje, voda, nafta in prostor so postali redki.","Zato mora razvoj upoštevati ekologijo: obnovljivi viri, recikliranje, trajnostno poslovanje. Ostaja vprašanje, kako z omejenimi viri najbolje zadovoljiti potrebe."]},{"n":7,"topic":"Oportunitetni oziroma alternativni stroški","title":"Oportunitetni strošek in odločanje","question":"Pojasnite pojem oportunitetnih stroškov in razložite, zakaj so povezani z vsako pomembnejšo ekonomsko odločitvijo. Zakaj pri odločanju ni dovolj, da upoštevamo samo neposredne finančne stroške?","model":["**Oportunitetni strošek** je strošek zavržene priložnosti, torej vrednost druge najboljše alternative, ki je nismo izbrali.","Povezan je z vsako pomembno odločitvijo, ker zaradi redkosti vedno izbiramo. Izbira ene možnosti pomeni odpoved drugi.","Neposredni finančni stroški ne zadostujejo, ker ne pokažejo, kaj izgubimo: čas, priložnost, donos druge možnosti. Odločitev, ki je videti poceni, je lahko v resnici slaba.","**Primer:** če 3.600 € vežem na vlogo z 2 %, je moj oportunitetni strošek donos, ki bi ga dobil z obveznicami (3,5 %). Razlika je 54 € na leto."]},{"n":8,"topic":"Oportunitetni oziroma alternativni stroški","title":"Oprema ali skladišče (100.000 EUR)","question":"Podjetje ima na voljo 100.000 EUR, ki jih lahko nameni za nakup nove proizvodne opreme ali za razširitev skladiščnih zmogljivosti. Pojasnite, kaj predstavlja oportunitetni strošek posamezne odločitve. Kako bi se sami odločili in katere informacije bi potrebovali pred odločitvijo?","model":["• **Če kupim opremo,** je oportunitetni strošek korist, ki bi jo prineslo skladišče (manj stroškov najema, več zalog, hitrejše dobave).","• **Če razširim skladišče,** je oportunitetni strošek korist opreme (večja proizvodnja, nižji stroški na enoto).","**Informacije, ki bi jih potreboval:** pričakovani prihodki ali prihranki pri obeh možnostih, stroški (nabava, vzdrževanje, amortizacija), povpraševanje, kje je ozko grlo, rok vračila, tveganje in način financiranja.","**Odločitev:** če proizvodnja ne dohaja naročil, izberem opremo. Če blago leži, ker ni prostora, izberem skladišče."]},{"n":9,"topic":"Oportunitetni oziroma alternativni stroški","title":"Subjektivnost oportunitetnih stroškov","question":"Oportunitetni stroški so subjektivni in nosi jih tisti, ki sprejema odločitev. Pojasnite, kaj to pomeni v praksi. Ali se lahko dva posameznika za enako odločitev soočata z različnimi oportunitetnimi stroški? Utemeljite svoje mnenje.","model":["Subjektivni so zato, ker je od odločevalca odvisno, kaj mu je druga najboljša možnost in koliko jo ceni. Nihče drug ga ne more objektivno izmeriti. Nosi ga tisti, ki izbira, in ga ne more prenesti na drugega.","**Da, dva človeka z enako odločitvijo imata lahko različen strošek.** Primer: oba delata v soboto. Študent bi sicer učil za izpit, upokojenec bi sicer počival. Za študenta je oportunitetni strošek višji, če je izpit pomemben.","Enako velja za podjetja: eno ima alternativno donosno naložbo, drugo ne, zato je isti nakup za prvo dražji."]},{"n":10,"topic":"Ekonomski cilji družbe in tri temeljna vprašanja","title":"Najpomembnejši ekonomski cilji družbe","question":"Pojasnite najpomembnejše ekonomske cilje družbe. Kateri izmed njih se vam zdi najpomembnejši za dolgoročno blaginjo prebivalstva? Svoj odgovor utemeljite in pojasnite, kakšne posledice bi imelo zanemarjanje tega cilja.","model":["**Cilji:** ekonomska rast in razvoj, polna zaposlenost, stabilnost cen, pravična delitev dohodkov, ekonomska varnost (bolni, invalidi, ostareli) ter tehnološka in ekonomska učinkovitost.","**Meni se zdi najpomembnejša polna zaposlenost,** ker zaposlitev daje dohodek, socialno varnost in občutek koristnosti, od nje pa so odvisni tudi drugi cilji: višja poraba, več davkov in lažje financiranje socialne države.","**Če jo zanemarimo:** brezposelnost, revščina, manj davkov, socialna napetost, odhod mladih v tujino in dolgoročno nižja rast."]},{"n":11,"topic":"Ekonomski cilji družbe in tri temeljna vprašanja","title":"Polna zaposlenost in stabilnost cen","question":"Družba si prizadeva za polno zaposlenost, hkrati pa želi ohranjati stabilnost cen. Pojasnite, zakaj sta lahko ta dva ekonomska cilja v konfliktu. Kako bi po vašem mnenju morala država iskati ravnotežje med njima?","model":["Ko je zaposlenih več, ljudje več zaslužijo in več kupujejo. Povpraševanje raste, podjetja dvigujejo cene in plače, zato naraste inflacija.","Če država cene umirja (višje obrestne mere, manjša javna poraba), so krediti dražji, podjetja manj vlagajo in zaposlujejo manj. Obeh ciljev ne moremo popolnoma doseči hkrati.","**Ravnotežje:** država mora presoditi, kaj je v danem trenutku večji problem. Pri visoki inflaciji jo umiri, pri visoki brezposelnosti spodbuja zaposlovanje. Uporablja monetarne ukrepe (obrestne mere) in fiskalne (davki, javna poraba). Dolgoročno pomaga vlaganje v znanje in produktivnost, da rast plač ne dvigne cen."]},{"n":12,"topic":"Ekonomski cilji družbe in tri temeljna vprašanja","title":"Kaj, kako in za koga proizvajati","question":"Vsaka družba mora odgovoriti na tri temeljna ekonomska vprašanja: kaj, kako in za koga proizvajati. Pojasnite vsako izmed njih na konkretnem primeru proizvodnega podjetja. Katero od teh vprašanj se vam zdi najzahtevnejše za sodobno podjetje in zakaj?","model":["Primer: podjetje, ki proizvaja pohištvo.","• **KAJ:** katere izdelke in koliko jih (mize, omare, kuhinje).","• **KAKO:** s kakšno tehnologijo in viri (ročno ali s CNC stroji, kateri les, koliko delavcev, domača ali uvožena surovina).","• **ZA KOGA:** kdo je kupec (premium ali ekonomski segment, domači ali tuji trg). Zajema tudi razdelitev produkta, torej cene, plače in dobiček.","**Najzahtevnejše je po mojem »za koga«.** Če ni kupcev, ne pomaga ne pravi izdelek ne učinkovita proizvodnja. Trg se hitro spreminja, zato mora podjetje stalno spremljati, kaj kupci res potrebujejo."]},{"n":13,"topic":"Ekonomske potrebe in dobrine","title":"Primarne in sekundarne potrebe","question":"Pojasnite razliko med primarnimi in sekundarnimi potrebami. Kako se potrebe spreminjajo z gospodarskim razvojem in višjim življenjskim standardom? Ali menite, da sodobna potrošniška družba ustvarja tudi potrebe, ki jih posamezniki dejansko ne potrebujejo? Podajte primer.","model":["• **Primarne (eksistenčne)** so nujne za preživetje: hrana, voda, obleka, streha.","• **Sekundarne** so višje in niso nujne, a izboljšajo kakovost življenja: izobrazba, potovanja, kultura, tehnologija.","Z razvojem in višjim standardom primarne potrebe ostanejo, sekundarne pa se množijo, ker ljudje, ko so osnovne zadovoljene, želijo več.","**Da, potrošniška družba ustvarja tudi nepotrebne potrebe.** Oglaševanje, moda in družbena omrežja ustvarijo občutek, da nekaj potrebujemo, čeprav tega prej nismo imeli. Primer: vsako leto nov pametni telefon, čeprav star še deluje, ali hitra moda."]},{"n":14,"topic":"Ekonomske potrebe in dobrine","title":"Mejna koristnost in zakon padajoče mejne koristnosti","question":"Pojasnite razliko med celotno in mejno koristnostjo ter razložite zakon padajoče mejne koristnosti. Kako podjetja in trgovci to zakonitost upoštevajo pri oblikovanju prodajnih strategij? Podajte praktičen primer.","model":["• **Celotna koristnost** je skupna korist vseh porabljenih enot dobrine.","• **Mejna koristnost** je korist zadnje, dodatne enote.","**Zakon padajoče mejne koristnosti:** z vsako dodatno enoto je mejna koristnost manjša, ker je potreba vse bolj zadovoljena. Celotna koristnost sicer še raste, vendar vse počasneje.","**Primer:** prvi kos pice po treningu je odličen, tretji že manj, peti nič. Zato sem za prvega pripravljen plačati več kot za petega.","**Podjetja** to upoštevajo pri količinskih popustih (»3 za 2«, večje pakiranje ceneje), akcijah in pri novi ponudbi (novi okusi), ker kupec za dodatne enote ni več pripravljen plačati polne cene."]},{"n":15,"topic":"Ekonomske potrebe in dobrine","title":"Potrošne, kapitalne in intermediarne dobrine","question":"Pojasnite razliko med potrošnimi, kapitalnimi in intermediarnimi dobrinami. Razvrstite konkretne primere iz proizvodnega podjetja in utemeljite, zakaj je pomembno, da podjetje pravilno razume njihovo vlogo v poslovnem procesu.","model":["• **Potrošne:** kupec jih uporablja neposredno za zadovoljitev potreb (miza, omara).","• **Kapitalne (investicijske):** uporabljajo se v proizvodnji in se postopoma obrabljajo (CNC stroj, delavnica, orodja).","• **Intermediarne:** surovine in materiali, iz katerih nastane izdelek, in se porabijo (les, lak, vijaki).","**Zakaj je pomembno:** vsaka vrsta drugače vpliva na stroške. Kapitalne dobrine pomenijo naložbe in amortizacijo (fiksni stroški), intermediarne variabilne stroške, potrošne pa prodajo in cene. Če podjetje to zamenja, napačno načrtuje nabavo, stroške in naložbe."]},{"n":16,"topic":"Produkcija in reprodukcijski proces","title":"Produkcija in vhodni elementi","question":"Pojasnite, kaj je produkcija in zakaj predstavlja temeljno gospodarsko dejavnost. Kako se v produkcijskem procesu vhodni elementi spreminjajo v izdelke ali storitve? Pojasnite na primeru podjetja, ki proizvaja pohištvo.","model":["**Produkcija** je proces, v katerem iz naravnih dobrin z delom in proizvodnimi sredstvi ustvarjamo dobrine in storitve za zadovoljevanje potreb. Je temeljna dejavnost, ker brez nje ni dobrin in ne dohodkov.","**Vhodni elementi:** delovna sila, predmeti dela (surovine) in sredstva za delo (stroji, prostori).","**Primer, pohištvo:** les, lak in okovje (predmeti dela) + stroji in delavnica (sredstva za delo) + delavci se z rezanjem, brušenjem, sestavljanjem in lakiranjem spremenijo v mizo ali omaro.","Produkcija je tudi družbeni proces: v njej so odnosi med ljudmi, lastništvo, upravljanje in delitev presežka."]},{"n":17,"topic":"Produkcija in reprodukcijski proces","title":"Enostavna, razširjena in zožena reprodukcija","question":"Pojasnite razliko med enostavno, razširjeno in zoženo reprodukcijo. Predstavite okoliščine, v katerih bi se podjetje odločilo za posamezno obliko reprodukcije. Katera oblika se vam zdi z vidika dolgoročnega razvoja podjetja najbolj zaželena in zakaj?","model":["• **Enostavna:** proizvodnja v enakem obsegu. Podjetje se odloči zanjo ob stabilnem povpraševanju, ko samo vzdržuje poslovanje.","• **Razširjena:** obseg se poveča. Odloči se zanjo ob rastočem povpraševanju, ko dobiček vloži v nove stroje in zaposlene.","• **Zožena:** obseg se zmanjša. Pojavi se ob padcu povpraševanja, izgubi, zastareli opremi ali krizi.","**Najbolj zaželena je razširjena,** ker omogoča rast, nova delovna mesta in konkurenčnost. Mora biti premišljena in financirana tako, da podjetje ne preseže svojih zmožnosti. Enostavna je varna, vendar lahko podjetje zaostane, zožena pa kaže težave."]},{"n":18,"topic":"Produkcija in reprodukcijski proces","title":"Naturalna in blagovna produkcija, delitev dela","question":"Pojasnite razliko med naturalno in blagovno produkcijo. Kako je delitev dela vplivala na razvoj blagovne produkcije in sodobnega gospodarstva? Ali menite, da je specializacija dela vedno prednost za podjetje? Utemeljite svoje mnenje.","model":["• **Naturalna:** proizvajamo za lastno uporabo (kmet za svojo družino).","• **Blagovna (tržna):** proizvajamo za prodajo na trgu.","**Delitev dela** pomeni, da se vsak specializira. Zato raste produktivnost in je izdelkov več, ljudje pa ne morejo sami narediti vsega, zato menjajo. Tako so nastali trg, denar in blagovna produkcija, na kateri temelji sodobno gospodarstvo.","**Ali je specializacija vedno prednost? Ne vedno.** Prednost je večja produktivnost in kakovost. Slabosti so odvisnost od dobaviteljev in enega trga ter enoličnost dela. Če izdelek ne gre več v prodajo, se specializirano podjetje težko preusmeri. Zato je v glavnem prednost, vendar jo je dobro dopolniti z več izdelki ali trgi."]},{"n":19,"topic":"Premoženje podjetja, kapital in dolgovi","title":"Premoženje podjetja: stalna in gibljiva sredstva","question":"Pojasnite, kaj predstavlja premoženje podjetja in zakaj brez premoženja podjetje ne more izvajati poslovnega procesa. Razložite razliko med stalnimi in gibljivimi sredstvi ter navedite konkretne primere.","model":["**Premoženje** so vsa sredstva (stvari, pravice, denar), ki jih podjetje uporablja pri poslovanju. Brez njega ni poslovnega procesa: podjetje potrebuje stroje, prostore, material in denar za plače.","• **Stalna (osnovna) sredstva:** dolgoročna, uporabljajo se več let (zgradbe, stroji, vozila, oprema, licence).","• **Gibljiva sredstva:** kratkoročna, hitro se obrnejo (zaloge, terjatve do kupcev, denar na računu)."]},{"n":20,"topic":"Premoženje podjetja, kapital in dolgovi","title":"Premoženje, kapital in dolgovi","question":"Pojasnite razliko med premoženjem, kapitalom in dolgovi podjetja. Zakaj mora podjetnik pri ocenjevanju finančnega položaja podjetja upoštevati tudi obveznosti do drugih subjektov? Podajte praktičen primer.","model":["• **Premoženje:** vsa sredstva podjetja.","• **Dolgovi:** tisto, kar podjetje dolguje drugim (posojila banki, dobaviteljem, državi, zaposlenim).","• **Kapital:** lastniški del, torej **premoženje − dolgovi**.","Obveznosti moramo upoštevati, ker del premoženja ni »naš«, ampak ga bo treba vrniti. Podjetje z velikim premoženjem in velikimi dolgovi je lahko v slabšem položaju kot manjše podjetje brez dolgov.","**Primer:** premoženje 500.000 €, dolgovi 450.000 € → kapital 50.000 €. Če podjetje izgubi 60.000 €, je kapital negativen in podjetje je prezadolženo."]},{"n":21,"topic":"Premoženje podjetja, kapital in dolgovi","title":"Financiranje širitve z zadolževanjem","question":"Podjetje želi financirati širitev poslovanja z dodatnim zadolževanjem. Pojasnite, kako lahko zadolževanje vpliva na kapital in finančni položaj podjetja. Ali menite, da je uporaba dolgoročnega financiranja dobra poslovna odločitev? Kdaj je smiselna in kdaj lahko postane nevarna?","model":["**Vpliv:** z zadolževanjem se povečajo sredstva (dobimo denar) in dolgovi, **kapital ostane enak** (kapital = premoženje − dolgovi). Delež dolga raste, finančna stabilnost je manjša, pojavijo se obresti in odplačila. Kapital se lahko posredno zmanjša, če obresti povzročijo izgubo.","• **Smiselno:** ko naložba prinese več kot obresti (finančni vzvod), ko prihodki zagotavljajo odplačila in ko dolgoročno naložbo (stroj) financiramo z dolgoročnim virom.","• **Nevarno:** pri visokih dolgovih, negotovih prihodkih, rasti obrestnih mer ali če se naložba ne obnese. Tvega se plačilna nesposobnost.","**Moje mnenje:** je dobra odločitev, če je dobro načrtovana. Pred posojilom bi preveril, ali naložba res prinese dovolj za obresti in odplačila."]},{"n":22,"topic":"Amortizacija","title":"Amortizacija in njen pomen","question":"Pojasnite, zakaj osnovna sredstva med uporabo izgubljajo svojo vrednost in kakšen je namen amortizacije. Kakšen pomen ima amortizacija pri ugotavljanju stroškov poslovanja in v načrtovanju prihodnjih investicij podjetja?","model":["Osnovna sredstva izgubljajo vrednost zaradi **fizične obrabe** (uporaba) in **ekonomskega zastaranja** (nove tehnologije).","**Namen amortizacije:** strošek sredstva razporediti po letih uporabe, tako da vsako leto ustrezen del bremeni poslovni izid.","**Pomen:** brez amortizacije bi bili stroški podcenjeni in dobiček napihnjen. Vpliva na lastno ceno izdelkov, hkrati pa pomaga pri načrtovanju zamenjave opreme in prihodnjih naložb."]},{"n":24,"topic":"Amortizacija","title":"Linearna amortizacija stroja (200.000 EUR, 4 leta)","question":"Podjetje kupi proizvodni stroj z nabavno vrednostjo 200.000 EUR in življenjsko dobo štirih let. Pojasnite, kako bi izračunali linearno amortizacijsko stopnjo in letno amortizacijo. Kakšne prednosti in slabosti ima enakomerno amortiziranje z vidika poslovnega načrtovanja?","model":["**Amortizacijska stopnja** = 100 % / življenjska doba = 100 % / 4 = **25 %**.","**Letna amortizacija** = stopnja × nabavna vrednost = 25 % × 200.000 € = **50.000 €**. Po štirih letih je sedanja vrednost 0.","Po letih: sedanja vrednost 150.000 → 100.000 → 50.000 → 0 €.","• **Prednosti:** preprost izračun, enak strošek vsako leto, lažje načrtovanje in primerjava.","• **Slabosti:** stroj se v resnici ne obrablja enakomerno (prva leta izgubi več vrednosti), ne upošteva tehnološkega zastaranja in naraščajočih stroškov vzdrževanja v poznih letih."]},{"n":26,"topic":"Osnovni koncept stroškov","title":"Fiksni in variabilni stroški","question":"Pojasnite razliko med fiksnimi in variabilnimi stroški. Na primeru proizvodnega podjetja navedite vsaj tri vrste posameznih stroškov in utemeljite njihovo razvrstitev. Zakaj je pomembno, da podjetje pozna svojo stroškovno strukturo?","model":["• **Fiksni stroški** se kratkoročno ne spreminjajo z obsegom proizvodnje. Plačamo jih tudi, če ne proizvajamo.","• **Variabilni stroški** se spreminjajo z obsegom proizvodnje. Če ne proizvajamo, so enaki nič.","**Primer, pohištvo:**","• najemnina delavnice: **fiksni** (enaka je, če naredimo 10 ali 100 miz),","• amortizacija stroja (časovna): **fiksni**,","• les in lak: **variabilni** (več miz, več materiala),","• plače proizvodnih delavcev po učinku: **variabilni**.","**Zakaj je struktura pomembna:** potrebujemo jo za oblikovanje cen, za izračun praga rentabilnosti in za odločitve o obsegu. Podjetje z visokimi fiksnimi stroški je bolj tvegano, ker ob padcu prodaje stroški ostanejo."]},{"n":27,"topic":"Osnovni koncept stroškov","title":"Proporcionalni, degresivni in progresivni stroški","question":"Podjetje povečuje obseg proizvodnje, vendar se njegovi stroški ne povečujejo enako hitro kot proizvodnja. Pojasnite razliko med proporcionalnimi, degresivnimi in progresivnimi variabilnimi stroški. Kateri pojav bi moral vodstvo podjetja najbolj skrbeti in zakaj?","model":["• **Proporcionalni** rastejo enako hitro kot obseg (pri dvakrat več miz je dvakrat več materiala).","• **Degresivni** rastejo počasneje od obsega (količinski popusti pri nakupu materiala, boljša izkoriščenost energije in delovne sile). To je primer iz vprašanja: stroški rastejo počasneje od proizvodnje.","• **Progresivni** rastejo hitreje od obsega (nadure, obraba, slaba organizacija blizu meje zmogljivosti).","**Najbolj bi moral vodstvo skrbeti progresivni pojav,** ker povečanje proizvodnje poje dobiček, pogosto pa kaže, da je podjetje blizu meje kapacitet. Treba je najti vzrok in razmisliti o novih zmogljivostih ali boljši organizaciji."]},{"n":28,"topic":"Prag rentabilnosti","title":"Prag rentabilnosti","question":"Pojasnite, kaj predstavlja prag rentabilnosti in zakaj je pomemben za poslovno odločanje. Kaj nam pove razmerje med celotnimi prihodki in skupnimi stroški ter kakšen je položaj podjetja pod pragom rentabilnosti in nad njim?","model":["**Prag rentabilnosti** (točka preloma) je obseg proizvodnje ali prodaje, pri katerem so **celotni prihodki enaki skupnim stroškom** (fiksni + variabilni). Dobiček je takrat nič.","• **Pod pragom:** stroški presegajo prihodke, podjetje posluje z izgubo.","• **Nad pragom:** prihodki presegajo stroške, podjetje ustvarja dobiček.","**Pomen:** pove, koliko moramo prodati, da ne ustvarjamo izgube. Pomaga pri odločitvah o ceni, obsegu in naložbah.","**Izračun:** Q = fiksni stroški / (cena − variabilni stroški na enoto). Primer: FS 20.000 €, cena 10 €, VS 6 € → Q = 20.000 / 4 = **5.000 kosov** (prihodek 50.000 €).","V gradivu je graf z **dvema prelomnima točkama**: pred prvo je izguba, med njima dobiček, za drugo spet izguba, ker ob polni zasedenosti kapacitet skupni stroški narastejo hitreje od prihodkov."]},{"n":29,"topic":"Prag rentabilnosti","title":"Nakup dodatnega stroja in prag rentabilnosti","question":"Podjetje načrtuje povečanje proizvodnih zmogljivosti z nakupom dodatnega stroja. Pojasnite, kako lahko ta odločitev vpliva na fiksne stroške, skupne stroške in prag rentabilnosti. Katere informacije bi moralo vodstvo pridobiti pred sprejetjem takšne odločitve?","model":["**Vpliv:**","• **fiksni stroški** se povečajo (amortizacija, obresti, vzdrževanje, prostor),","• **skupni stroški** se zato povečajo pri enakem obsegu,","• **prag rentabilnosti** se zviša, ker mora podjetje prodati več, da pokrije višje stroške.","Hkrati stroj poveča zmogljivost in lahko zniža variabilne stroške na enoto (hitrejši stroj, manj odpada), kar prag delno zniža.","**Primer:** FS 20.000 € → 30.000 €, cena 10 €, VS 6 € → prag se dvigne s 5.000 na 7.500 kosov.","**Informacije pred odločitvijo:** pričakovana prodaja in povpraševanje, cena, nabavna vrednost in doba amortizacije, vir financiranja in obresti, variabilni stroški z in brez stroja, izkoriščenost kapacitet in rok vračila."]},{"n":30,"topic":"Prag rentabilnosti","title":"Ali je prag rentabilnosti dovolj za uspešno poslovanje","question":"Ali menite, da je doseganje praga rentabilnosti zadosten pokazatelj uspešnega poslovanja podjetja? Pojasnite razliko med poslovanjem brez izgube in dolgoročno uspešnim poslovanjem. Katere dodatne kazalnike bi po vašem mnenju moralo podjetje spremljati?","model":["**Ne, ni dovolj.** Na pragu podjetje ne ustvari nič dobička: ne more vračati posojil, vlagati v razvoj ali izplačati lastnikov.","• **Poslovanje brez izgube:** podjetje komaj pokrije stroške.","• **Dolgoročno uspešno poslovanje:** podjetje ustvarja dovolj dobička za razvoj, vračanje dolgov in nagrado lastnikov, je plačilno sposobno in konkurenčno.","**Dodatni kazalniki:**","• **rentabilnost** (dobiček / kapital),","• **ekonomičnost** (celotni prihodki / celotni odhodki),","• **produktivnost** (količina izdelkov / enota dela),","• plačilna sposobnost (likvidnost), denarni tok, rast prodaje, tržni delež in zadolženost."]}];

function any(...r){ return {t:'any', r}; }
function all(...r){ return {t:'all', r}; }

    c(1.5, 'posledice za podjetje (izguba, stečaj, nepotrebni stroški, slabša konkurenčnost)', any(/izgub/, /stecaj/, /nepotrebn\w* strosk/, /konkurencn/, /propad/, /nelikvid/, /zaloge/, /potrat/)),

// ---------- ocenjevanje ----------
function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/naprimer/g,'na primer').replace(/\bv (vsakem|tem|nasprotnem|vsaki|takem|nasem) primeru\b/g,'').replace(/\s+/g,' ').trim();
}
// ---------- tipkarske napake, sopomenke, vsebinska podobnost ----------
function toks(t){ return t.split(/[^a-z0-9]+/).filter(Boolean); }
function stem5(w){ return w.length >= 5 ? w.slice(0, 5) : w; }
function osa(a, b){ // Damerau-Levenshtein (zamenjava sosednjih črk šteje kot 1 napaka)
  const al = a.length, bl = b.length; if(!al) return bl; if(!bl) return al;
  const d = []; for(let i = 0; i <= al; i++) d[i] = [i]; for(let j = 1; j <= bl; j++) d[0][j] = j;
  for(let i = 1; i <= al; i++) for(let j = 1; j <= bl; j++){
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[al][bl];
}
let _IDX = null;
function buildIdx(){
  if(_IDX) return _IDX;
  const freq = {}, df = {};
  QS.forEach(q => {
    const seen = new Set();
    toks(norm(q.model.join(' '))).forEach(w => { freq[w] = (freq[w] || 0) + 1; if(w.length >= 5) seen.add(stem5(w)); });
    toks(norm(q.question + ' ' + q.title)).forEach(w => { freq[w] = (freq[w] || 0) + 1; });
    seen.forEach(s => { df[s] = (df[s] || 0) + 1; });
  });
  const pref = {};
  Object.keys(freq).forEach(w => { if(w.length >= 7){ const p = w.slice(0, 9); if(!pref[p] || freq[w] > freq[pref[p]]) pref[p] = w; } });
  _IDX = {freq, df, pref, keys: Object.keys(pref), shorts: Object.keys(freq).filter(w => w.length >= 5 && w.length <= 7)};
  return _IDX;
}
// Popravi tipkarske napake pri daljših besedah (7+ črk) na najbližjo besedo iz slovarja vprašanj in odgovorov.
function fixTypos(t){
  const I = buildIdx();
  const out = t.replace(/[a-z]{7,}/g, w => {
    if(I.freq[w]) return w;
    const p = w.slice(0, 9);
    if(I.pref[p]) return w; // znana beseda v drugem sklonu
    let best = null, bd = 2;
    for(const k of I.keys){
      if(k[0] !== w[0] || Math.abs(k.length - p.length) > 1) continue;
      const d = osa(p, k);
      if(d < bd){ bd = d; best = k; }
    }
    return best ? I.pref[best] : w;
  });
  // krajše besede (5-6 črk): popravi samo, če se ujemata prva in zadnja črka in je razlika ena napaka
  return out.replace(/\b[a-z]{5,6}\b/g, w => {
    if(I.freq[w]) return w;
    let best = null, bf = -1;
    for(const s of I.shorts){
      if(s[0] !== w[0] || s[s.length - 1] !== w[w.length - 1] || Math.abs(s.length - w.length) > 1) continue;
      if(osa(w, s) === 1 && I.freq[s] > bf){ best = s; bf = I.freq[s]; }
    }
    return best || w;
  });
}
// Sopomenke: če se v odgovoru pojavi zapis, ki pomeni isto, dodamo kanonično besedo, ki jo iščejo merila.
const SYN = [
  [/\b(izgub\w*|zrtvuj\w*|zrtvova\w*|odrec\w*|odpovedat\w*|odpovedujem|ne morem imet\w*|ne bom imel\w*)/, 'odpovem odpoved'],
  [/\b(ni dovolj|premalo|primanjkuj\w*|primanjkljaj\w*|pomanjkanj\w*|zmanjkuj\w*|zmanjka|nimamo dovolj|ne moremo (imeti|kupiti|imet|kupit) vsega|vsega ne moremo)/, 'omejen redk premalo'],
  [/\b(zasluz\w*|profit\w*)/, 'dobicek'],
  [/\b(zguba|dela izgubo|delamo izgubo|v minusu)\b/, 'izguba'],
  [/\b(drug\w* (moznost|opcij\w*|stvar\w*|izbir\w*|variant\w*)|opcij\w*|variant\w*)/, 'alternativ'],
  [/\b(kupec|kupci|kupcev|stranke|strank|odjemalc\w*|porabnik\w*)/, 'kupc potrosnik'],
  [/\b(posojil\w*|kredit\w*|zadolz\w*|dolgov\w*)/, 'dolg zadolz posojil'],
  [/\b(obrabi\w*|obrabl\w*|izrabl\w*|zastarel\w*|zastar\w*)/, 'obrab zastaran'],
  [/\b(odpisuj\w*|odpisemo|odpis\w*|razporedi\w*|razporeja\w*)/, 'razporedi amortizacij'],
  [/\b(budzet\w*|prorac\w*)/, 'prorac'],
  [/\b(firm\w*|podjetnik\w*|delodajal\w*|tovarn\w*)/, 'podjetj'],
  [/\b(razlicn\w*|drugacn\w*|ni isto|ni enak\w*|vsak (po )?svoje|vsak drugace)/, 'razlicn'],
  [/\b(nacrtuj\w*|nacrtova\w*|premisl\w*|pametno)/, 'nacrtn premisljen'],
];
function augment(t){
  let extra = '';
  for(const [rx, add] of SYN) if(rx.test(t)) extra += ' ' + add;
  return extra ? t + ' ' + extra : t;
}
// Delež "značilnih" besed vzorčnega odgovora (brez besed iz vprašanja in preveč splošnih), ki jih odgovor vsebuje.
function simScore(n, t){
  const I = buildIdx();
  const q = QS.find(x => x.n === n); if(!q) return 0;
  const qs = new Set(toks(norm(q.question + ' ' + q.title)).filter(w => w.length >= 5).map(stem5));
  const ms = new Set();
  toks(norm(q.model.join(' '))).forEach(w => {
    if(w.length < 5) return;
    const s = stem5(w);
    if(!qs.has(s) && (I.df[s] || 0) / QS.length <= 0.3) ms.add(s);
  });
  if(!ms.size) return 0;
  const us = new Set(toks(t).filter(w => w.length >= 5).map(stem5));
  let hit = 0; ms.forEach(s => { if(us.has(s)) hit++; });
  return hit / ms.size;
}
function hit(x, t){ return x instanceof RegExp ? x.test(t) : evalSpec(x, t) >= 1; }
// Odstrani dele odgovora, ki so prepisani iz vprašanja (5 ali več besed zapored), da prepisano vprašanje ne šteje kot znanje.
function stripQuestion(t, n){
  const q = QS.find(x => x.n === n); if(!q) return t;
  const qt = toks(norm(q.question));
  const grams = new Set();
  for(let i = 0; i + 5 <= qt.length; i++) grams.add(qt.slice(i, i + 5).join(' '));
  const uw = t.split(' ');
  const cw = uw.map(w => w.replace(/[^a-z0-9]/g, ''));
  const drop = new Array(uw.length).fill(false);
  for(let i = 0; i + 5 <= uw.length; i++){
    if(grams.has(cw.slice(i, i + 5).join(' '))) for(let k = i; k < i + 5; k++) drop[k] = true;
  }
  return uw.filter((w, i) => !drop[i]).join(' ');
}
function evalSpec(sp, t){
  if(sp.t === 'any') return sp.r.some(x => hit(x, t)) ? 1 : 0;
  if(sp.t === 'all'){ const k = sp.r.filter(x => hit(x, t)).length; return k === sp.r.length ? 1 : k / sp.r.length * 0.5; }
  const n = sp.r.filter(x => hit(x, t)).length;
  return Math.min(1, n / sp.min);
}function grade(n, text){
  const t0 = stripQuestion(norm(text), n);
  const words = t0 ? t0.split(' ').length : 0;
  const t1 = fixTypos(t0);
  const t = augment(t1);
  const cr = CR[n] || [];
  const tot = cr.reduce((a, x) => a + x[0], 0) || 1;
  // "Slogovna" merila (primer, mnenje) štejejo samo, če je odgovor vsebinsko pokrit.
  const isStyle = sp => sp.r.includes(EX) || sp.r.includes(OP);
  const fs = cr.map(([w, label, sp]) => evalSpec(sp, t));
  let ct = 0, cg = 0;
  cr.forEach(([w, label, sp], i) => { if(!isStyle(sp)){ ct += w; cg += w * fs[i]; } });
  const gate = ct ? Math.max(0, Math.min(1, ((cg / ct) - 0.15) / 0.45)) : 1;
  let got = 0; const res = [];
  cr.forEach(([w, label, sp], i) => {
    const f = isStyle(sp) ? fs[i] * gate : fs[i];
    got += w * f;
    res.push({label, f, pts: w / tot * 100});
  });
  let pct = got / tot * 100;
  const sim = simScore(n, t1);
  const simPct = Math.min(1, sim / 0.45) * 100;
  pct = Math.max(pct, 0.6 * pct + 0.4 * simPct);
  const pen = [];
  for(const [p, label, rx] of (PEN[n] || [])){
    if(rx.test(t)){ pen.push({label, pts: p / tot * 100}); pct -= p / tot * 100; }
  }
  let short = false;
  if(words < 12){ pct *= 0.5; short = true; }
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  return {pct, res, pen, words, short, sim};
}
function verdict(p){
  if(p >= 85) return ['Odlično', 'good'];
  if(p >= 70) return ['Dobro', 'good'];
  if(p >= 50) return ['Delno pravilno', 'mid'];
  if(p >= 30) return ['Šibko', 'bad'];
  return ['Premalo ali mimo', 'bad'];
}

  h += '<div class="card"><span class="pill">' + esc(q.topic) + '</span> <span class="pill">vpr. ' + q.n + '</span>';
  h += '<div class="q">' + esc(q.question) + '</div>';
  if(!S.graded){
    h += '<textarea id="ans" placeholder="Napiši odgovor po svoje. Ctrl+Enter za preverjanje." autofocus></textarea>';
    h += '<div class="row" style="margin-top:10px"><button class="btn" data-act="check">Preveri odgovor</button><button class="btn sec" data-act="skip">Preskoči</button><button class="btn sec" data-act="peek">Pokaži vzorčni odgovor</button></div>';
    h += '<div class="hint" style="margin-top:8px">Namig: napiši definicijo, razlago, primer in (če vprašanje to zahteva) svoje mnenje.</div>';
    if(S.peek) h += '<div class="model"><b>Vzorčni odgovor</b>' + modelHtml(q) + '</div>';
  } else {
    const g = S.graded; const [vt, vc] = verdict(g.pct);
    h += '<div class="score"><div class="pct ' + vc + '">' + g.pct + ' %</div><div><div class="verdict">' + vt + '</div><div class="hint">' + g.words + ' besed' + (g.short ? ' · odgovor je prekratek, ocena je prepolovljena' : '') + ' · pokritost vsebine vzorca ' + Math.round(g.sim * 100) + ' %' + '</div></div></div>';
    h += '<div class="bar"><i style="width:' + g.pct + '%;background:var(--' + (vc === 'good' ? 'good' : vc === 'mid' ? 'mid' : 'bad') + ')"></i></div>';
    h += '<h2 style="margin-top:14px">Razčlenitev po merilih</h2><ul class="crit">';
    g.res.forEach(r => {
      const cls = r.f >= 1 ? 'ok' : r.f > 0 ? 'part' : 'no';
      const ic = r.f >= 1 ? '✓' : r.f > 0 ? '~' : '✗';
      const got = Math.round(r.pts * r.f * 10) / 10;
      h += '<li class="' + cls + '"><span class="ic">' + ic + '</span><span>' + esc(r.label) + (r.f > 0 && r.f < 1 ? ' <i>(delno)</i>' : '') + '</span><span class="pts">' + got + ' / ' + Math.round(r.pts * 10) / 10 + '</span></li>';
    });
    g.pen.forEach(p => { h += '<li class="pen"><span class="ic">!</span><span>' + esc(p.label) + '</span><span class="pts">−' + Math.round(p.pts * 10) / 10 + '</span></li>'; });
    h += '</ul>';
    h += '<div class="model"><b>Vzorčni odgovor</b>' + modelHtml(q) + '</div>';
    h += '<div class="note">Program preverja ključne pojme. Če si bistvo povedal pravilno z drugimi besedami, lahko manjka kakšna točka. Za natančnejši pregled kopiraj odgovor in ga prilepi Claudu.</div>';
    h += '<div class="row"><button class="btn" data-act="next">' + (S.i + 1 < total ? 'Naslednje vprašanje' : 'Rezultat') + '</button><button class="btn sec" data-act="retry">Poskusi znova</button><button class="btn sec" data-act="copy">Kopiraj za Claude</button><span class="hint" id="copied"></span></div>';
  }
  h += '</div>';
  $app.innerHTML = h;
  const ta = document.getElementById('ans');
  if(ta){ ta.value = S.draft || ''; ta.focus(); ta.addEventListener('input', () => { S.draft = ta.value; }); ta.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doCheck(); }); }
}

function renderSummary(){
  const arr = S.list.map(q => ({q, r: S.session[q.n]})).filter(x => x.r);
  const avg = arr.length ? Math.round(arr.reduce((a, x) => a + x.r.pct, 0) / arr.length) : 0;
  const [vt, vc] = verdict(avg);
  let h = '<h1>Rezultat</h1><div class="card"><div class="score"><div class="pct ' + vc + '">' + avg + ' %</div><div><div class="verdict">' + vt + '</div><div class="hint">povprečje ' + arr.length + ' odgovorov</div></div></div>';
  h += '<table><tr><th>Vpr.</th><th>Naslov</th><th>%</th></tr>';
  arr.forEach(x => {
    const [, c2] = verdict(x.r.pct);
    h += '<tr><td>' + x.q.n + '</td><td>' + esc(x.q.title) + '</td><td><b class="pct ' + c2 + '" style="font-size:16px">' + x.r.pct + '</b></td></tr>';
  });
  h += '</table>';
  const weak = arr.filter(x => x.r.pct < 70);
  h += '<div class="row" style="margin-top:12px">' + (weak.length ? '<button class="btn" data-act="redoweak">Ponovi slabe (' + weak.length + ')</button>' : '') + '<button class="btn sec" data-act="menu">Meni</button></div></div>';
  $app.innerHTML = h;
}

function render(){
  if(S.view === 'menu') renderMenu();
  else if(S.view === 'quiz') renderQuiz();
  else renderSummary();
  window.scrollTo(0, 0);
}

function doCheck(){
  const q = S.list[S.i];
  const txt = (document.getElementById('ans') || {}).value || S.draft || '';
  if(!txt.trim()){ return; }
  const g = grade(q.n, txt);
  S.graded = g; S.answer = txt; S.draft = '';
  S.session[q.n] = {pct: g.pct, answer: txt};
  const h = HIST[q.n] || {best: 0, last: 0, tries: 0};
  h.last = g.pct; h.best = Math.max(h.best, g.pct); h.tries++;
  HIST[q.n] = h; saveHist();
  render();
}
function copyPrompt(){
  const q = S.list[S.i];
  const msg = 'Preveri moj odgovor na vprašanje za kolokvij (Ekonomika in podjetništvo). Oceni ga v % (točnost, popolnost, razumevanje), povej, kaj je pravilno, kaj manjka ali je napačno, in predlagaj izboljšavo. Pri mnenjih ne išči ene pravilne rešitve, ampak ali je utemeljeno.\n\nVPRAŠANJE (' + q.n + '):\n' + q.question + '\n\nMOJ ODGOVOR:\n' + S.answer + '\n\nREFERENCA (vzorčni odgovor iz mojega gradiva):\n' + modelText(q);
  const done = () => { const el = document.getElementById('copied'); if(el) el.textContent = 'Kopirano. Prilepi v pogovor s Claudom.'; };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(msg).then(done, () => fallbackCopy(msg, done)); }
  else fallbackCopy(msg, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-topic]'); if(!b) return;
  if(b.dataset.topic !== undefined){ start(QS.filter(q => q.topic === TOPICS_ORDER[+b.dataset.topic]), false); return; }
  const a = b.dataset.act;
  if(a === 'all') start(QS, false);
  else if(a === 'randall') start(QS, true);
  else if(a === 'rand10') start(shuffle(QS).slice(0, 10), false);
  else if(a === 'weak') start(QS.filter(q => HIST[q.n] && HIST[q.n].last < 70), true);
  else if(a === 'redoweak') start(S.list.filter(q => S.session[q.n] && S.session[q.n].pct < 70), true);
  else if(a === 'menu'){ S = {view:'menu', list:[], i:0, session:{}, graded:null}; render(); }
  else if(a === 'reset'){ if(confirm('Pobrišem vso zgodovino rezultatov?')){ HIST = {}; saveHist(); render(); } }
  else if(a === 'check') doCheck();
  else if(a === 'skip'){ S.peek = false; S.draft = ''; S.graded = null; if(S.i + 1 < S.list.length){ S.i++; render(); } else { S.view = 'summary'; render(); } }
  else if(a === 'peek'){ S.peek = true; render(); }
  else if(a === 'next'){ S.graded = null; S.peek = false; if(S.i + 1 < S.list.length){ S.i++; render(); } else { S.view = 'summary'; render(); } }
  else if(a === 'retry'){ S.graded = null; S.draft = S.answer || ''; render(); }
  else if(a === 'copy') copyPrompt();
});
render();
</script>
</body>
</html>
